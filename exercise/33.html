<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3 style="color: rgb(145, 22, 221); text-align: center;">
        File upload to go Server
    </h3>
    <div style="width: 300px; border: 2px solid darkorchid; padding: 1rem; 
    position: relative; border-radius: 1rem; height: 10rem; margin-inline: auto;">
        <form action="http://localhost:3040/upload" method="post" enctype="multipart/form-data"
            style="width: 80%; height: 90%; display: flex; flex-direction: column; gap: 2rem; align-items: center;"
        >
            <input type="file" name="file" style="align-content: center; margin-inline: auto; max-width: 12rem;">
            <button type="submit"
            style="background-color: rgb(106, 47, 143); color: aliceblue; font-weight: 600;
             letter-spacing: .3mm; font-size: medium; border: none; padding: .5rem 2rem; border-radius: .4rem;"
            >
            Upload file
            </button>
        </form>
    </div>
</body>
</html>
